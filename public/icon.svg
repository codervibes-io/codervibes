<!--
  The bolt, drawn rather than borrowed.

  It used to be the ⚡ emoji inside an SVG <text>, which meant the browser drew
  it from whatever emoji font the machine had: yellow-and-blue on Apple, a
  different yellow on Windows, and on no platform the colour of this product.
  Text also positions by font metrics, so at 16px it sat wherever the glyph's
  baseline happened to fall.

  As a path it is the same shape everywhere, crisp at every size, and in the
  app's own colours: the accent on near-black. The green here is a step
  brighter than the console's accent, which is pitched to read on white and
  goes muddy on a dark ground.

  This is the source. apple-touch-icon.png (180, full bleed - iOS applies its
  own squircle mask and would fill rounded corners with black) and
  icon-512.png (rounded, transparent corners) are rendered from the same six
  points and the same two colours. Change them here, then redraw those two
  with scripts/render-icons.mjs, which rasterises this file in headless Chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CoderVibes">
  <rect width="32" height="32" rx="7" fill="#14161a" />
  <path d="M19 2 L8 18 H15 L12 30 L24 13 H17 Z" fill="#3a8f5f" />
</svg>
